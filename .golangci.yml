# golangci-lint v2 configuration for eob-mcp.
#
# Memory-safety gates are enforced here. Any change that loosens these
# settings should be justified in the PR description.

version: "2"

run:
  timeout: 5m
  go: "1.24"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # built-in static analysis
    - ineffassign    # ineffective assignments
    - staticcheck    # broad static analysis
    - unused         # unused identifiers
    - gosec          # security audit
    - bodyclose      # http.Response.Body must be closed
    - copyloopvar    # loop variable capture (Go 1.22+)
    - errorlint      # error wrapping correctness
    - forbidigo      # ban specific imports/functions (used for unsafe)
    - gocritic       # additional checks
    - misspell       # spelling in identifiers/comments
    - nilerr         # returning nil with non-nil err and vice versa
    - noctx          # net/http requests without context
    - revive         # idiomatic Go style
    - unconvert      # unnecessary type conversions
    - unparam        # unused function params
    - usestdlibvars  # use stdlib constants over magic strings

  settings:
    forbidigo:
      # Memory-safety enforcement: ban opt-outs from Go's safety guarantees.
      forbid:
        - pattern: '^unsafe\.'
          msg: "use of unsafe.* is forbidden; isolate any required unsafe code in a vetted, fuzzed helper"
        - pattern: '^reflect\.NewAt$'
          msg: "reflect.NewAt is an unsafe escape hatch; do not use"
        - pattern: '^reflect\.UnsafePointer$'
          msg: "reflect.UnsafePointer is an unsafe escape hatch; do not use"
        - pattern: '^runtime\.SetFinalizer$'
          msg: "runtime.SetFinalizer is brittle and rarely correct; prefer explicit Close()"
      analyze-types: true

    gosec:
      excludes:
        - G104  # errcheck handles unhandled errors at higher fidelity

    errcheck:
      check-type-assertions: true
      # check-blank stays at its default (false): explicit `_ = err` is
      # acceptable acknowledgement when the caller has nothing meaningful
      # to do with the error.

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
