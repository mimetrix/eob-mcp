syntax = "proto3";

package eob.v1;

option go_package = "github.com/mimetrix/eob-mcp/gen/go/eob/v1;eobv1";

import "google/protobuf/struct.proto";

// EoBService is the unified surface exposed by eob-mcp. Both the MCP
// front door and the gRPC listener delegate to a single in-process
// implementation of this service. Each RPC corresponds 1:1 with one MCP
// tool of the snake_cased same name (e.g. ClusterIdentity ↔ cluster_identity).
//
// Federation envelope: every response carries a ClusterRef tagging which
// site produced it, so an aggregator fanning out to N sites can key and
// merge results without out-of-band context.
service EoBService {
  rpc ClusterIdentity(ClusterIdentityRequest) returns (ClusterIdentityResponse);
  rpc EoBHealth(EoBHealthRequest) returns (EoBHealthResponse);
  // Health of the co-resident RACE/TRACE defense stack (separate from the
  // EoB stack above). Presence-aware: components report "absent" when the
  // defense namespaces/DaemonSets are not installed on this site.
  rpc TraceHealth(TraceHealthRequest) returns (TraceHealthResponse);
  rpc ResourceList(ResourceListRequest) returns (ResourceListResponse);
  rpc ResourceGet(ResourceGetRequest) returns (ResourceGetResponse);
  rpc ResourceApply(ResourceApplyRequest) returns (ResourceApplyResponse);
  rpc ResourceDelete(ResourceDeleteRequest) returns (ResourceDeleteResponse);
  rpc ResourceSchema(ResourceSchemaRequest) returns (ResourceSchemaResponse);

  // Data plane — typed read-side over Tawon's JetStream output. No
  // decoding, no aggregation; consumers compose tshark / DuckDB / jq
  // externally. See docs/ARCHITECTURE.md.
  rpc StreamList(StreamListRequest) returns (StreamListResponse);
  rpc StreamStats(StreamStatsRequest) returns (StreamStatsResponse);
  rpc StreamRead(StreamReadRequest) returns (StreamReadResponse);

  // ────────────────────────────────────────────────────────────────────
  // Federation extensions — used by an aggregator (fleet console) that
  // fans out across N independent EoB sites. These RPCs are gRPC-first;
  // the MCP front door does not expose them (streaming + batch
  // semantics don't map cleanly to MCP tool calls).
  // ────────────────────────────────────────────────────────────────────

  // Heartbeat is the cheap-polling liveness endpoint. Aggregator calls
  // this every 30s against every site; richer RPCs only fire when
  // heartbeat reports something off.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // BatchApply applies many manifests in one call. Per-item independent:
  // one failure does not abort the rest. Returns per-item status.
  rpc BatchApply(BatchApplyRequest) returns (BatchApplyResponse);

  // WatchResources streams kubernetes-watch-shaped events for a Kind so
  // the aggregator does not poll. Closes on client cancel.
  rpc WatchResources(WatchResourcesRequest) returns (stream WatchResourcesResponse);

  // EventStream surfaces k8s Events + eob-mcp's own audit events as
  // they happen. Includes resource_apply / resource_delete that the
  // aggregator itself issued (closes the loop on what the fleet did).
  rpc EventStream(EventStreamRequest) returns (stream EventStreamResponse);

  // TailStream is the live-tail companion to StreamRead. Same envelope
  // shape; pushed as messages arrive in JetStream rather than paged.
  rpc TailStream(TailStreamRequest) returns (stream TailStreamResponse);
}

// ──────────────────────────────────────────────────────────────────────
// Common types
// ──────────────────────────────────────────────────────────────────────

// ClusterRef identifies the site that produced a response. An aggregator
// uses (site_id, tenant) as the disambiguation key when merging results
// from multiple eob-mcp instances.
message ClusterRef {
  string site_id = 1;
  string tenant  = 2;
  string region  = 3;
}

// ──────────────────────────────────────────────────────────────────────
// ClusterIdentity
// ──────────────────────────────────────────────────────────────────────

message ClusterIdentityRequest {}

message ClusterIdentityResponse {
  ClusterRef cluster     = 1;
  string     k8s_version = 2;
  string     eob_version = 3;
  string     mcp_version = 4;
}

// ──────────────────────────────────────────────────────────────────────
// EoBHealth
// ──────────────────────────────────────────────────────────────────────

message EoBHealthRequest {}

// status is one of: "ok" | "degraded" | "absent" | "error".
message ComponentStatus {
  string kind    = 1;
  int32  ready   = 2;
  int32  desired = 3;
  string status  = 4;
  string detail  = 5;
}

message DirectiveStatus {
  string name    = 1;
  int32  ready   = 2;
  int32  desired = 3;
  string status  = 4;
}

// With one DaemonSet per directive, a node may host multiple agent pods;
// the shape is counts rather than a single per-pod string.
message NodeAgentSummary {
  int32 ready = 1;
  int32 total = 2;
}

message EoBHealthResponse {
  ClusterRef                    cluster         = 1;
  // components keys: "operator", "dashboard", "streamstore", "webhook",
  // "agent" (aggregate of all directive DaemonSets).
  map<string, ComponentStatus>  components      = 2;
  // Per-directive DaemonSet breakdown, sorted by name for stable output.
  repeated DirectiveStatus      directives      = 3;
  // Per-node agent pod counts; pods without an assigned node appear under "<pending>".
  map<string, NodeAgentSummary> agents_per_node = 4;
  // cluster_state is "connected" (eob-mcp has a kube client) or
  // "no-cluster" (started without in-cluster or kubeconfig access). When
  // "no-cluster", components/directives/agents_per_node are empty.
  string                        cluster_state   = 5;
}

// ──────────────────────────────────────────────────────────────────────
// TraceHealth — co-resident RACE/TRACE defense stack
// ──────────────────────────────────────────────────────────────────────

message TraceHealthRequest {}

message TraceHealthResponse {
  ClusterRef                    cluster         = 1;
  // components keys: "trace_agent" (TRACE host-observation DaemonSet),
  // "race_agent" (RACE perimeter-denial DaemonSet). Each "absent" when
  // its namespace/DaemonSet is not installed.
  map<string, ComponentStatus>  components      = 2;
  // Per-node agent pod readiness, merged across both DaemonSets.
  map<string, NodeAgentSummary> agents_per_node = 3;
  // "connected" | "no-cluster" (same semantics as EoBHealth).
  string                        cluster_state   = 4;
}

// ──────────────────────────────────────────────────────────────────────
// Resource* (generic CRD CRUD)
//
// api_group defaults to the server's configured CRD group
// (typically "tawon.mantisnet.com") when omitted.
// ──────────────────────────────────────────────────────────────────────

message ResourceListRequest {
  string kind           = 1;
  string api_group      = 2;
  string namespace      = 3;
  string label_selector = 4;
}

message ResourceListResponse {
  ClusterRef                      cluster    = 1;
  string                          kind       = 2;
  string                          api_group  = 3;
  bool                            namespaced = 4;
  int32                           count      = 5;
  // One Struct per item — slim summary produced server-side.
  repeated google.protobuf.Struct items      = 6;
}

message ResourceGetRequest {
  string kind      = 1;
  string api_group = 2;
  string namespace = 3;
  string name      = 4;
}

message ResourceGetResponse {
  ClusterRef             cluster = 1;
  // Full unstructured k8s object; Struct round-trips JSON losslessly.
  google.protobuf.Struct object  = 2;
}

message ResourceApplyRequest {
  string manifest = 1;
  bool   dry_run  = 2;
  bool   force    = 3;
}

message ResourceApplyResponse {
  ClusterRef cluster          = 1;
  string     kind             = 2;
  string     api_group        = 3;
  string     namespace        = 4;
  string     name             = 5;
  bool       namespaced       = 6;
  bool       dry_run          = 7;
  string     uid              = 8;
  string     resource_version = 9;
  int64      generation       = 10;
}

message ResourceDeleteRequest {
  string kind      = 1;
  string api_group = 2;
  string namespace = 3;
  string name      = 4;
}

// status is one of: "deleted" | "notFound".
message ResourceDeleteResponse {
  ClusterRef cluster = 1;
  string     kind    = 2;
  string     name    = 3;
  string     status  = 4;
}

message ResourceSchemaRequest {
  string kind      = 1;
  string api_group = 2;
}

message ResourceSchemaResponse {
  ClusterRef             cluster           = 1;
  string                 group             = 2;
  string                 kind              = 3;
  string                 storage_version   = 4;
  google.protobuf.Struct openapi_v3_schema = 5;
}

// ──────────────────────────────────────────────────────────────────────
// Stream* — data plane
// ──────────────────────────────────────────────────────────────────────

// StreamInfo summarizes one NATS JetStream stream.
message StreamInfo {
  string name     = 1;
  uint64 messages = 2;
  uint64 bytes    = 3;
  // RFC3339 timestamps; empty when the stream is empty.
  string first_ts = 4;
  string last_ts  = 5;
}

message StreamListRequest {}

message StreamListResponse {
  ClusterRef          cluster = 1;
  repeated StreamInfo streams = 2;
}

message StreamStatsRequest {
  string name  = 1;
  // RFC3339 window bounds; empty means open-ended on that side.
  string since = 2;
  string until = 3;
}

message StreamStatsResponse {
  ClusterRef cluster  = 1;
  string     name     = 2;
  uint64     messages = 3;
  uint64     bytes    = 4;
  string     since    = 5;
  string     until    = 6;
}

message StreamReadRequest {
  string name   = 1;
  // RFC3339 window bounds; empty means deliver from oldest /
  // unbounded upper.
  string since  = 2;
  string until  = 3;
  // Maximum messages to return. 0 → server default. Capped server-side.
  int32  limit  = 4;
  // jq expression evaluated against each message's decoded JSON; only
  // messages where the expression yields a truthy value are returned.
  // Empty → no filter. Syntax is jq (itchyny/gojq); we do not invent
  // an expression language.
  string filter = 5;
}

// RawEnvelope is one Tawon envelope read from JetStream. data is the
// envelope's JSON, decoded once server-side so consumers (and the jq
// filter) get a structured object rather than bytes. Tawon's wire
// format is unchanged — we do not transform fields.
message RawEnvelope {
  string                 subject   = 1;
  uint64                 sequence  = 2;
  string                 timestamp = 3; // RFC3339
  google.protobuf.Struct data      = 4;
}

message StreamReadResponse {
  ClusterRef           cluster  = 1;
  string               name     = 2;
  int32                count    = 3;
  repeated RawEnvelope messages = 4;
}

// ──────────────────────────────────────────────────────────────────────
// Heartbeat — cheap liveness + drift detection
// ──────────────────────────────────────────────────────────────────────

message HeartbeatRequest {}

message HeartbeatResponse {
  ClusterRef cluster        = 1;
  // RFC3339; aggregator computes its own clock skew against this.
  string     server_time    = 2;
  // Seconds since process start; resets on pod restart.
  int64      uptime_seconds = 3;
  // Backend reachability snapshots, observed by the most recent
  // health-probe pass (not freshly re-tested for every Heartbeat).
  bool       kube_reachable    = 4;
  bool       streams_reachable = 5;
  // Coarse counters useful for fleet dashboards.
  int32      directive_count = 6;
  int32      stream_count    = 7;
  // Errors observed by the server's internal log handler in the last
  // 24h (best-effort, may reset on restart). Aggregator uses this as
  // a "drill in here" signal.
  int32      error_count_24h = 8;
  // Build identity — same fields as ClusterIdentity but kept here so
  // Heartbeat is self-sufficient for fleet inventory.
  string     mcp_version = 9;
  string     eob_version = 10;
}

// ──────────────────────────────────────────────────────────────────────
// BatchApply — multi-manifest apply with per-item status
// ──────────────────────────────────────────────────────────────────────

message BatchApplyItem {
  // Same payload as ResourceApplyRequest.manifest. YAML or JSON.
  string manifest = 1;
  // Optional per-item override; when unset, falls back to the batch
  // request's dry_run / force.
  bool   dry_run  = 2;
  bool   force    = 3;
}

message BatchApplyRequest {
  repeated BatchApplyItem items = 1;
  // Batch-level defaults; per-item flags override.
  bool dry_run = 2;
  bool force   = 3;
}

// status is one of: "applied" | "error".
message BatchApplyResult {
  string kind             = 1;
  string api_group        = 2;
  string namespace        = 3;
  string name             = 4;
  string status           = 5;
  string error            = 6;
  string uid              = 7;
  string resource_version = 8;
  int64  generation       = 9;
  bool   dry_run          = 10;
}

message BatchApplyResponse {
  ClusterRef                cluster = 1;
  repeated BatchApplyResult items   = 2;
  // Convenience counters; sum to items.length.
  int32                     applied = 3;
  int32                     errors  = 4;
}

// ──────────────────────────────────────────────────────────────────────
// WatchResources — server-streaming k8s watch
// ──────────────────────────────────────────────────────────────────────

message WatchResourcesRequest {
  string kind           = 1;
  string api_group      = 2;
  string namespace      = 3;
  string label_selector = 4;
  // Optional starting point. Empty → server picks a "list-then-watch"
  // strategy (initial ADDED events for each existing object, then
  // updates). Set to "0" for "watch latest only" semantics.
  string resource_version = 5;
}

// event_type matches k8s watch: "ADDED" | "MODIFIED" | "DELETED" |
// "BOOKMARK" | "ERROR". On BOOKMARK, object carries the current
// resourceVersion only — useful for resumable streams.
message WatchResourcesResponse {
  ClusterRef             cluster          = 1;
  string                 event_type       = 2;
  string                 kind             = 3;
  string                 api_group        = 4;
  google.protobuf.Struct object           = 5;
  // Convenience: top-level object metadata fields lifted out so
  // aggregators can route without re-parsing object.
  string                 namespace        = 6;
  string                 name             = 7;
  string                 resource_version = 8;
}

// ──────────────────────────────────────────────────────────────────────
// EventStream — k8s Events + eob-mcp audit, unified
// ──────────────────────────────────────────────────────────────────────

message EventStreamRequest {
  // Optional filters. Empty fields mean "all".
  string namespace = 1;
  // Filter by k8s involvedObject.kind. e.g. "ClusterDirective".
  string kind      = 2;
  // "k8s" | "audit" | "" (both). k8s = events API, audit = eob-mcp's
  // own apply/delete trail.
  string source    = 3;
}

// type is one of: "Normal" | "Warning" | "Audit". reason mirrors
// k8s Events.reason for source=k8s; for source=audit it's one of
// "ResourceApply" | "ResourceDelete" | "BatchApply".
message EventStreamResponse {
  ClusterRef cluster           = 1;
  string     source            = 2; // "k8s" | "audit"
  string     type              = 3;
  string     reason            = 4;
  string     message           = 5;
  string     timestamp         = 6; // RFC3339
  // Involved object — k8s Events.involvedObject, or the apply target
  // for audit events.
  string     involved_kind     = 7;
  string     involved_name     = 8;
  string     involved_namespace = 9;
  // For source=audit: identity of the caller (mTLS subject or token
  // claim) when available; empty otherwise. We do not invent identities.
  string     actor             = 10;
}

// ──────────────────────────────────────────────────────────────────────
// TailStream — live tail of a JetStream stream
// ──────────────────────────────────────────────────────────────────────

message TailStreamRequest {
  string name = 1;
  // jq filter, same semantics as StreamRead.filter.
  string filter = 2;
  // Optional starting point. Mutually exclusive; if both set,
  // start_at_seq wins.
  //   start_at_seq=0 + start_at_ts="" → deliver new messages only
  //   start_at_seq=N                  → deliver from sequence N forward
  //   start_at_ts=RFC3339             → deliver from that timestamp forward
  uint64 start_at_seq = 3;
  string start_at_ts  = 4;
}

// Wraps RawEnvelope so every streamed message carries the federation
// envelope (ClusterRef) — same pattern as the unary responses.
message TailStreamResponse {
  ClusterRef  cluster  = 1;
  RawEnvelope envelope = 2;
}

