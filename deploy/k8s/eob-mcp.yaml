---
# eob-mcp: ServiceAccount, RBAC, Deployment, Service.
#
# Namespace assumption: this manifest deploys into the tawon-operator
# namespace, the same namespace as the EoB workload pods. The namespace
# is expected to already exist (created by the EoB chart). If you need
# to deploy elsewhere, search/replace the namespace and update the
# EOB_TAWON_NAMESPACE env var to match.
#
# Image reference: quay.io/mantisnet/eob-mcp:dev resolves via the
# in-cluster registry mirror configured on every node
# (registries.conf.d -> 172.31.44.247:5000). To iterate locally, build
# and push to that registry directly; the manifest does not change.
#
# RBAC: a single ClusterRole + ClusterRoleBinding grants the verbs
# needed by all registered tools. Three buckets:
#
# Read-only health/identity (eob_health, cluster_identity):
#   - get Deployments/StatefulSets in two namespaces (operators, tawon-operator)
#   - get + list DaemonSets (per-directive DSs are discovered by label
#     selector, not fixed name)
#   - list Pods (for per-node agent readiness)
#   - get MutatingWebhookConfigurations (the cluster-scoped EoB webhook
#     `eob-mutate`, not a Deployment)
#
# Generic CRD CRUD (resource_list, _get, _apply, _delete):
#   - full verbs on tawon.mantisnet.com/* so the dynamic client can
#     create/update/delete ClusterDirectives, Dashboards, StreamStores,
#     Streams, DirectiveBindings, TopologyAggregators
#
# CRD schema discovery (resource_schema):
#   - get + list on apiextensions.k8s.io/customresourcedefinitions so we
#     can pull the openAPIV3Schema for any kind on demand
#
# Verbs are narrow but the role is cluster-scoped because lookups span
# multiple namespaces. Tighten to per-namespace RoleBindings if a
# stricter scope is required (would lose the cluster-scoped CRD list).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: eob-mcp
  namespace: tawon-operator
  labels:
    app.kubernetes.io/name: eob-mcp
    app.kubernetes.io/component: mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eob-mcp-reader
  labels:
    app.kubernetes.io/name: eob-mcp
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Streamstore Service auto-discovery (when EOB_NATS_URL is unset).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get"]
  # Full CRUD on Tawon CRDs — enables resource_apply / resource_delete /
  # resource_get / resource_list for ClusterDirective, Dashboard,
  # StreamStore, Stream, DirectiveBinding, Directive, TopologyAggregator.
  - apiGroups: ["tawon.mantisnet.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD schema discovery — resource_schema lists CRDs and extracts the
  # OpenAPI v3 schema for any kind.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eob-mcp-reader
  labels:
    app.kubernetes.io/name: eob-mcp
subjects:
  - kind: ServiceAccount
    name: eob-mcp
    namespace: tawon-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eob-mcp-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eob-mcp
  namespace: tawon-operator
  labels:
    app.kubernetes.io/name: eob-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eob-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eob-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: eob-mcp
      automountServiceAccountToken: true
      # hostNetwork is required on F5 XC sites: the Vega CNI fails to
      # register a Virtual Network for user-created namespaces ("Error
      # in getting VN for namespace"), so non-EoB pods cannot get a pod
      # IP. Sharing the node netns sidesteps that. dnsPolicy is bumped
      # so the pod still resolves cluster DNS for the kubernetes API.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eob-mcp
          image: quay.io/mantisnet/eob-mcp:dev
          # Always pull while we share a single :dev tag across builds —
          # otherwise the kubelet sticks with the locally cached image
          # and rollout restarts silently re-run the previous binary.
          # Pulls hit the in-cluster registry mirror so the cost is local.
          imagePullPolicy: Always
          args:
            # 18443 / 19443 are used (not 8443 / 9443) because
            # hostNetwork=true means the container binds directly on the
            # node interface and the lower-numbered ports are already
            # taken by other host processes on every node. The Service
            # in-front of this Pod still publishes 8443 (MCP) and 9443
            # (gRPC) to consumers.
            - "-listen=:18443"
            - "-grpc-listen=:19443"
            - "-log-level=info"
            # TLS hooks (disabled by default). To enable: mount a TLS
            # Secret at /etc/eob-mcp/tls (see volumes/volumeMounts blocks
            # below, currently commented), then uncomment these args. The
            # same cert/key serves both listeners. Add -tls-client-ca for
            # mTLS once an aggregator CA exists.
            # - "-tls-cert=/etc/eob-mcp/tls/tls.crt"
            # - "-tls-key=/etc/eob-mcp/tls/tls.key"
            # - "-tls-client-ca=/etc/eob-mcp/tls/ca.crt"
          ports:
            - name: mcp
              containerPort: 18443
              protocol: TCP
            - name: grpc
              containerPort: 19443
              protocol: TCP
          env:
            # Identity values surface in cluster_identity output.
            # When unset, the server back-fills site / tenant / region by
            # parsing /etc/resolv.conf (the F5 XC CE platform publishes
            # the canonical `<site>.<tenant>.tenant.local` and
            # `<region>.compute.internal` search-domain pattern). Set any
            # of these explicitly to override discovery — useful only for
            # presentation overrides or non-XC deployments.
            # - name: EOB_SITE_ID
            #   value: ""
            # - name: EOB_TENANT
            #   value: ""
            # - name: EOB_REGION
            #   value: ""
            # Namespace overrides; defaults match the EoB chart so these
            # are only needed if a deployment renames the namespaces.
            # - name: EOB_OPERATOR_NAMESPACE
            #   value: "operators"
            # - name: EOB_TAWON_NAMESPACE
            #   value: "tawon-operator"
            # Data-plane NATS endpoint. When unset, the server discovers
            # the Tawon JetStream Service by label
            # (`app=tawon-streamstore`) in EOB_TAWON_NAMESPACE at startup
            # and uses that as the JetStream endpoint. If no matching
            # Service is found, Stream* RPCs are not registered. Set
            # EOB_NATS_URL explicitly only when pointing at an
            # externally-managed NATS server.
            # - name: EOB_NATS_URL
            #   value: "nats://external-nats.example:4222"
          readinessProbe:
            httpGet:
              path: /readyz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # To enable TLS: uncomment volumeMounts + volumes blocks and
          # uncomment the matching -tls-* args above. The Secret is
          # expected to be named "eob-mcp-tls" with keys tls.crt, tls.key,
          # and (for mTLS) ca.crt. cert-manager Certificate resources
          # produce this layout natively.
          # volumeMounts:
          #   - name: tls
          #     mountPath: /etc/eob-mcp/tls
          #     readOnly: true
      # volumes:
      #   - name: tls
      #     secret:
      #       secretName: eob-mcp-tls
---
apiVersion: v1
kind: Service
metadata:
  name: eob-mcp
  namespace: tawon-operator
  labels:
    app.kubernetes.io/name: eob-mcp
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eob-mcp
  ports:
    - name: mcp
      port: 8443
      targetPort: mcp        # resolves to containerPort 18443 by name
      protocol: TCP
    - name: grpc
      port: 9443
      targetPort: grpc       # resolves to containerPort 19443 by name
      protocol: TCP
